---
# Внутренние константы, которые пользователь роли менять не должен:
webserver_python: python3.12
webserver_packages:
  - python3.12   # Django 6.1 требует Python >= 3.12, системный python3 — 3.9
  - git          # роль deploy клонирует код с GitHub
  - libpq        # psycopg 3 загружает libpq.so во время работы

# Список пакетов — именно vars, а не defaults: он определяется тем, что
# требуют зависимости приложения, а не желанием пользователя роли.
