---
# Обработчики — задачи, которые запускаются ТОЛЬКО если их позвали через notify,
# и ровно один раз за прогон, даже если позвали десять раз.

#   Перезапуск базы — дорогая операция. Обработчик гарантирует, что она
#   произойдёт только при реальном изменении конфигурации и только раз.
#
# ПОДВОДНЫЙ КАМЕНЬ
#   Обработчики выполняются В КОНЦЕ плейбука, а не сразу после notify.
#   Если следующая задача рассчитывает на перезапущенную службу — нужен
#   meta: flush_handlers, иначе она отработает на старой конфигурации.

- name: Restart postgresql
  ansible.builtin.service:
    name: postgresql
    state: restarted
