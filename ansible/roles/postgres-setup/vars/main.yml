---
# vars — приоритет ВЫШЕ, чем у defaults, и выше, чем у переменных инвентаря.
# Сюда кладут внутренние константы роли, которые снаружи менять не следует.
#
# ЧТО НАПИСАТЬ
#
postgres_version: 17
postgres_packages:
  - postgresql{{ postgres_version }}-server
  - python3-psycopg2
postgres_data_dir: /var/lib/pgsql/data
#
# ПОЧЕМУ НЕ В defaults
#   Путь к pg_hba.conf определяется тем, как пакет собран. Если пользователь
#   роли его переопределит, роль сломается — значит это vars, а не defaults.
