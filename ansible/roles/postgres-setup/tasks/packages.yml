---
# Установка PostgreSQL.
- name: Установка PostgreSQL и psycopg2
  ansible.builtin.dnf:
    name: "{{ postgres_packages }}"
    state: present

- name: Инициализация кластера
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: "{{ postgres_data_dir }}/PG_VERSION"

- name: Запуск и автозапуск PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
