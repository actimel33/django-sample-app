---
# defaults — значения с САМЫМ НИЗКИМ приоритетом. Их перебивает что угодно:
# inventory, group_vars, -e в командной строке.
# Сюда кладут то, что пользователь роли захочет переопределить.
# ПРАВИЛО
#   Всё, что может отличаться между окружениями, — в defaults.
#   Всё, что менять нельзя, — в vars (приоритет выше, перебить сложнее).

postgres_listen_addresses: "*"
postgres_auth_method: scram-sha-256


