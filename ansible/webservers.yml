---
# Плейбук подготовки серверов приложения.
# Ставит то, что меняется редко: Python, системные пакеты, nginx.
- name: Prepare application servers
  hosts: all
  become: true
  roles:
    - webserver-setup
#
# ПОЧЕМУ ЭТО ОТДЕЛЬНЫЙ ПЛЕЙБУК, А НЕ ЧАСТЬ deploy.yml
#   Разделение по частоте изменений — главный принцип при нарезке ролей.
#   Пакеты и nginx ставятся один раз за жизнь машины, код деплоится каждый релиз.
