---
# Плейбук настройки сервера базы данных.
# Запускается на инстансе с тегом Role=db.
- name: Configure PostgreSQL server
  hosts: all
  become: true
  roles:
    - postgres-setup
#
# ПРО hosts ПРИ ЗАПУСКЕ ЧЕРЕЗ SSM
#   Документ AWS-ApplyAnsiblePlaybooks запускает плейбук НА САМОМ инстансе
#   с инвентарём из одной машины — localhost. Группы "db" там не существует.
#   Поэтому либо hosts: all, либо передавать нужную группу переменной.
#   hosts: all — самый простой вариант, который работает в обоих режимах:
#   и через SSM локально, и через плагин aws_ssm с машины.
